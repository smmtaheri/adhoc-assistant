services:
  adhoc-assistant-bot:
    build: .
    image: adhoc-assistant:latest
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
    restart: unless-stopped

  adhoc-assistant-cli:
    build: .
    image: adhoc-assistant:latest
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    profiles:
      - cli
    env_file:
      - .env
    volumes:
      - ./:/workspace
    command:
      - python
      - main.py
      - --db
      - adhoc_history.sqlite3
      - --csv
      - data/output/adhoc_schedule.csv
      - --html
      - data/output/adhoc_schedule.html
      - --image
      - data/output/adhoc_schedule.jpg
