services:
  adhoc-assistant-bot:
    build: .
    image: adhoc-assistant:latest
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./adhoc_config.toml:/app/adhoc_config.toml:ro
      - ./bot_config.toml:/app/bot_config.toml:ro
      - ./data:/app/data
      - ./output:/app/data/output
    command:
      - python
      - -m
      - adhoc_assistant.telegram_bot
      - --config
      - /app/bot_config.toml
      - --database
      - /app/data/adhoc_history.sqlite3
      - --output-dir
      - /app/data/output
    restart: unless-stopped

  adhoc-assistant-debug:
    build: .
    image: adhoc-assistant:latest
    profiles:
      - debug
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./adhoc_config.toml:/app/adhoc_config.toml:ro
      - ./bot_config.debug.toml:/app/bot_config.debug.toml:ro
      - ./data:/app/data
      - ./output/debug:/app/data/debug_output
    command:
      - python
      - -m
      - adhoc_assistant.telegram_bot
      - --config
      - /app/bot_config.debug.toml

  adhoc-assistant-timed:
    build: .
    image: adhoc-assistant:latest
    profiles:
      - timed
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./adhoc_config.toml:/app/adhoc_config.toml:ro
      - ./bot_config.timed.toml:/app/bot_config.timed.toml:ro
      - ./data:/app/data
      - ./output/timed:/app/data/timed_output
    command:
      - python
      - -m
      - adhoc_assistant.telegram_bot
      - --config
      - /app/bot_config.timed.toml
      - --reset-target-month

  adhoc-assistant-cli:
    build: .
    image: adhoc-assistant:latest
    profiles:
      - cli
    volumes:
      - ./adhoc_config.toml:/app/adhoc_config.toml:ro
      - ./data:/app/data
      - ./output:/app/data/output
    command:
      - python
      - main.py
      - --db
      - /app/data/adhoc_history.sqlite3
      - --csv
      - /app/data/output/adhoc_schedule.csv
      - --html
      - /app/data/output/adhoc_schedule.html
      - --image
      - /app/data/output/adhoc_schedule.jpg
