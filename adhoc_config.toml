# Monthly adhoc / bug-day schedule config.
#
# Fill this file every month, then run:
#   uv run python main.py
#   uv run python main.py --save-history

[date]
# Supported values: "jalali" (default) or "gregorian".
calendar = "jalali"

year = 1405
month = 5

[output]
csv = "adhoc_schedule.csv"

[[people]]
name = "Ali"
role = "backend"
unavailable_days = [3, 10]
unavailable_weekdays = []

[[people]]
name = "Sara"
role = "backend"
unavailable_days = []
unavailable_weekdays = ["یکشنبه"]

[[people]]
name = "Reza"
role = "frontend"
unavailable_days = [12]
unavailable_weekdays = []

[[people]]
name = "Nima"
role = "backend"
unavailable_days = []
unavailable_weekdays = ["پنجشنبه"]

# Holidays are still bug days. They are shown in the output, but only Fridays
# are skipped.
[[holidays]]
day = 15
name = "Sample holiday"

# Optional manual history. Prefer SQLite history for normal monthly usage.
