# Manual monthly adhoc / bug-day schedule config for the CLI.
#
# Fill this file every month, then run:
#   uv run python main.py
#   uv run python main.py --save-history
#
# Telegram bot mode reads schedule policy from this file, but uses members.toml
# for the team list and the bot users' button responses for availability.

[date]
# Supported values: "jalali" (default) or "gregorian".
calendar = "jalali"

year = 1405
month = 5

[output]
csv = "adhoc_schedule.csv"

[[people]]
name = "Ali"
role = "backend"
unavailable_days = [3, 10]
unavailable_weekdays = []

[[people]]
name = "Sara"
role = "backend"
unavailable_days = []
unavailable_weekdays = ["یکشنبه"]

[[people]]
name = "Reza"
role = "frontend"
unavailable_days = [12]
unavailable_weekdays = []

[[people]]
name = "Nima"
role = "backend"
unavailable_days = []
unavailable_weekdays = ["پنجشنبه"]

