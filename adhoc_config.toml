# Manual adhoc / bug-day schedule policy config for the CLI and bot.
#
# Team members and access levels live in SQLite bot_users, not in this file.
#
# Run:
#   uv run python main.py
#   uv run python main.py --save-history
#
# Optional custom range instead of year/month:
# start_date = "1405-05-10"
# end_date = "1405-06-10"

[date]
# Supported values: "jalali" (default) or "gregorian".
calendar = "jalali"

#year = 1405
#month = 5

start_date = "1405-04-15"
end_date = "1405-04-25"

[output]
csv = "adhoc_schedule.csv"

# Optional manual history. Prefer SQLite history for normal monthly usage.
#
# [history.PersonName]
# main_count = 2
# backup_count = 1
# total_count = 3
# thursday_count = 1
